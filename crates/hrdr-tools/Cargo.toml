[package]
name = "hrdr-tools"
description = "Agentic tool set for hrdr — read, write, edit, bash, grep, find, ls, todo, fetch, search, and MCP. Native OpenAI tool calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hrdr-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
glob.workspace = true
ignore.workspace = true
regex = "1"
similar.workspace = true
reqwest.workspace = true
async-trait = "0.1"
futures-util = { workspace = true }
which = "8"
# Randomizes the per-session scratch-dir name (src/sandbox.rs) so a recycled
# pid cannot land on a directory another local user created first.
rand.workspace = true
serde_path_to_error = "0.1.20"
shell-words = "1"
# CI pipeline configs, for the verification gate (src/gate.rs). Every provider
# worth reading — GitHub Actions, GitLab, CircleCI, Azure, Drone — writes YAML,
# so one parse covers them all.
serde_yaml_ng.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The sandbox fallback for hosts where bwrap or unprivileged user namespaces
# are unavailable: a filesystem ruleset the shell child applies to itself
# between fork and exec (see `src/sandbox.rs`). Version tracks Codex's pin.
landlock = "0.4"

[target.'cfg(unix)'.dependencies]
# Group-kill for subprocesses: `libc::kill(-pgid, SIGKILL)` reaches every
# descendant of a spawned shell, not just the direct child. See `src/proc.rs`.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects for tree-kill on Windows (the process-group analogue, see
# `src/proc.rs`), and GetFileInformationByHandle for the open-handle identity
# check that closes the `read` TOCTOU window (see `guard_not_swapped`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Sandboxes $HOME + the XDG roots before ANY test in this crate runs (ctor, no opt-in).
hrdr-test-support.workspace = true
# Backdating an mtime is the only way to test an age-based sweep without sleeping.
filetime.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
