[package]
name = "hrdr-llm"
description = "OpenAI-compatible chat-completions client for hrdr (streaming + native tool calls)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
reqwest.workspace = true
# Attachment payloads go on every provider wire base64-encoded (src/media.rs).
# Already a workspace dependency and already built for hrdr-agent — this wires
# the existing crate in, it does not add one.
base64.workspace = true
hjkl-xdg.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures-util.workspace = true
async-stream.workspace = true
# The retry driver (src/retry.rs) sleeps between attempts, which needs a timer.
# Already in the tree (reqwest runs on it, every other crate depends on it) —
# this promotes it from a dev-dependency, it does not add a crate.
tokio.workspace = true
# Inflating a PDF's object and cross-reference streams (src/pdf.rs), which is
# how every PDF written this decade stores its page tree. Already in the tree
# transitively — this promotes it to a direct dependency, it does not add one.
flate2.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for `owner_only_options_no_follow` (src/fs.rs, used by the wire-log
# open in src/client.rs) so a final-component symlink swapped in at open time
# fails with ELOOP instead of being followed — closing the check→open TOCTOU
# window atomically.
libc = "0.2"

[dev-dependencies]
futures-util.workspace = true
# Sandboxes $HOME + the XDG roots before ANY test in this crate runs (ctor, no opt-in).
hrdr-test-support.workspace = true
tempfile.workspace = true
