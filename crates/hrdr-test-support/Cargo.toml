[package]
name = "hrdr-test-support"
description = "Test-only: sandboxes $HOME and the XDG roots before any hrdr test runs. Never published, never linked into a release build."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Runs the sandbox at test-binary load, before `main` and before the test harness
# spawns a thread — the only point at which `env::set_var` is sound.
ctor = "1"
# Removes the sandbox at test-binary exit (ctor 1.x split the dtor into its own crate).
dtor = "1"
# `defer_tempdir` keeps a test's private temp dir alive until process exit.
tempfile.workspace = true
